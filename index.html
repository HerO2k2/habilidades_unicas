<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG - Grimório de Habilidades</title>
    <!-- Google Fonts: Cinzel para títulos épicos e Inter para leitura refinada -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Inter:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        :root {
            --bg-color: #121214;
            --glow-color: rgba(201, 3, 26, 0.25);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: #f3f4f6;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            position: relative;
        }

        /* Efeito de iluminação de fundo transparente (Ambient Light Glow) */
        .ambient-glow {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 140vw;
            height: 85vh;
            background: radial-gradient(
                ellipse 70% 60% at 50% 100%,
                var(--glow-color) 0%,
                rgba(18, 18, 20, 0.4) 50%,
                rgba(18, 18, 20, 0) 100%
            );
            pointer-events: none;
            z-index: 0;
            transition: background 0.8s ease-in-out;
        }

        .container-content {
            position: relative;
            z-index: 10;
        }

        /* Estilização da caixa de seleção no topo central */
        .custom-select-wrapper {
            position: relative;
            width: 100%;
            max-width: 520px;
        }

        select {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            background-color: rgba(22, 22, 26, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: all 0.3s ease;
        }

        select:focus, select:hover {
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 18px rgba(255, 255, 255, 0.12);
            outline: none;
        }

        select option {
            background-color: #18181c;
            color: #f3f4f6;
            padding: 12px;
        }

        /* Cartão de habilidade em Dark Glassmorphism */
        .skill-card {
            background: rgba(20, 20, 24, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            transition: transform 0.3s ease, border-color 0.5s ease;
        }

        /* Titulo da Habilidade */
        .skill-title {
            font-family: 'Cinzel', serif;
            letter-spacing: 0.08em;
            transition: color 0.4s ease, text-shadow 0.4s ease;
        }

        /* Elemento de lista na descrição */
        .description-item {
            position: relative;
            padding-left: 1.5rem;
        }

        .description-item::before {
            content: "•";
            position: absolute;
            left: 0.25rem;
            color: rgba(255, 255, 255, 0.4);
            font-size: 1.2rem;
            line-height: 1;
        }

        /* Destaque de Dano e Ataque: Laranja Vibrante (#ff9d00) */
        .hl-damage {
            color: #ff9d00;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(255, 157, 0, 0.35);
            padding: 0 2px;
        }

        /* Destaque de Vida, Cura e Sobrevivência: Verde Vibrante (#2ed573) */
        .hl-heal {
            color: #2ed573;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(46, 213, 115, 0.35);
            padding: 0 2px;
        }

        /* Estrelas de estatística */
        .star-active {
            color: #ffd700;
            text-shadow: 0 0 6px rgba(255, 215, 0, 0.4);
        }

        .star-inactive {
            color: #4b5563;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between min-h-screen p-4 md:p-8 select-none">

    <!-- Luz ambiente suave e transparente no fundo -->
    <div id="ambientGlow" class="ambient-glow"></div>

    <div class="container-content w-full max-w-3xl flex flex-col items-center my-auto py-6">
        
        <!-- [Caixa de seleção no meio superior da tela] -->
        <div class="custom-select-wrapper mb-8 w-full">
            <label for="skillSelect" class="block text-center text-xs uppercase tracking-widest text-gray-400 mb-2 font-semibold">
                Selecione uma Habilidade
            </label>
            <div class="relative">
                <select id="skillSelect" onchange="updateSkill()" class="w-full text-center text-base md:text-lg font-medium py-3.5 px-6 rounded-xl cursor-pointer text-gray-100">
                    <!-- Opções preenchidas pelo JavaScript -->
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-400">
                    <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
                        <path d="M9.293 12.95l0.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/>
                    </svg>
                </div>
            </div>
        </div>

        <!-- [Cartão Principal da Habilidade] -->
        <div class="skill-card w-full rounded-2xl p-6 md:p-10 flex flex-col justify-between gap-6">
            
            <!-- [Nome da Habilidade selecionada] -->
            <div class="text-center border-b border-white/10 pb-5">
                <h1 id="skillTitle" class="skill-title font-black text-2xl md:text-3xl lg:text-4xl uppercase tracking-wider">
                    <!-- Título dinâmico -->
                </h1>
            </div>

            <!-- [Descrição da habilidade] -->
            <div id="skillDescription" class="space-y-3 text-gray-200 text-sm md:text-base leading-relaxed my-2">
                <!-- Lista da descrição -->
            </div>

            <!-- [Frase / Citação do Personagem] -->
            <div id="skillQuoteContainer" class="border-t border-white/10 pt-4 text-center">
                <p id="skillQuote" class="text-xs md:text-sm italic text-gray-400 tracking-wide">
                    <!-- Citação dinâmica -->
                </p>
            </div>

            <!-- [Estatísticas: Dificuldade à esquerda e Poder à direita] -->
            <div class="flex flex-col sm:flex-row justify-between items-center gap-4 border-t border-white/10 pt-5 text-sm font-semibold text-gray-300">
                
                <!-- Dificuldade (Esquerda) -->
                <div class="flex items-center gap-2 bg-black/40 px-4 py-2 rounded-lg border border-white/5 w-full sm:w-auto justify-between sm:justify-start">
                    <span class="text-xs uppercase tracking-wider text-gray-400">Dificuldade:</span>
                    <span id="skillDifficulty" class="text-base tracking-widest font-mono"></span>
                </div>

                <!-- Poder (Direita) -->
                <div class="flex items-center gap-2 bg-black/40 px-4 py-2 rounded-lg border border-white/5 w-full sm:w-auto justify-between sm:justify-start">
                    <span class="text-xs uppercase tracking-wider text-gray-400">Poder:</span>
                    <span id="skillPower" class="text-base tracking-widest font-mono"></span>
                </div>

            </div>

        </div>

    </div>

    <script>
        // Tabela de Cores das Dificuldades
        const difficultyColors = {
            0: "#fef7d5", // 0 estrelas
            1: "#0ec0c1", // 1 estrela
            2: "#910142", // 2 estrelas
            3: "#6c043c", // 3 estrelas
            4: "#c9031a", // 4 estrelas

        };

        // Lista completa com as 13 habilidades do RPG
        const skillsData = [

                ],

            },
            {

                difficulty: 2,

                    "Pode inverter seus pontos de AGI por FOR em combate e reverter a escolha como uma ação livre."
                ],
                quote: "Vingarei quem foi importante pra mim antes de cumprir meu papel. - Doyle"
            },
            {
                name: "PuMP€d B¥ S1Lv3R_Sh4d0₩",
                difficulty: 3,
                power: 0,
                description: [
                    "Role 1d20 para revelar uma fraqueza de uma criatura, dificuldade variada. Em caso de falha pode tentar novamente em outro turno."
                ],
                quote: "Nada é invencível. Só está mal documentado. - Barry Hargrove"
            },
            {
                name: "Sobrevivente do Fogo",
                difficulty: 1,
                power: 0,
                description: [
                    "Ao sofrer dano em uma explosão de fogo fatal fora de combate, sobreviverá com <span class=\"hl-heal\">1d8 de vida</span>. Se o evento acontecer em combate, então sobreviverá com <span class=\"hl-heal\">1d4 de vida</span>."
                ],
                quote: "Já senti o inferno uma vez. Quando ele voltou, eu estava preparado. - Fred Bone"
            },
            {
                name: "Fogo Cruzado",
                difficulty: 4,
                power: 5,
                description: [
                    "Durante 3 turnos individuais, seus ataques causam <span class=\"hl-damage\">1d12 + Equipamento</span>.",
                    "Ao ser atingido por um ataque corpo a corpo, causa <span class=\"hl-damage\">2d8 de dano</span> e pode se translocar. Cooldown: 2 rodadas."
                ],
                quote: "Você teve sua chance - V"
            },
            {
                name: "Arsenal de Armas",
                difficulty: 5,
                power: 5,
                description: [
                    "Pode carregar e utilizar 4 armas de fogo simultaneamente: 2 pistolas, 1 escopeta e 1 submetralhadora.",
                    "Pode realizar um combo com as 4 armas, realizando um ataque com cada uma. Durante o combo, nenhuma munição é consumida. Dano: <span class=\"hl-damage\">4d8 + 2d10</span>. Cooldown: 3 rodadas."
                ],

            },
            {
                name: "Viagem Sem Volta",
                difficulty: 5,
                power: 5,

                    "Benni libera uma fumaça paranormal que distorce completamente a realidade ao redor. Cria uma área de 6m por 2 turnos.",

                ],
                quote: "Calma, chefe... é só uma viagem. — Benni Mota"
            },
            {

                power: 5,
                description: [
                    "Realiza um golpe corpo a corpo extremamente explosivo, causando <span class=\"hl-damage\">6d10 + LUTA de dano de Impacto</span>.",
                    "O alvo atingido é arremessado 4m e todas as criaturas adjacentes sofrem <span class=\"hl-damage\">2d8 de dano</span>. Cooldown: 3 rodadas."
                ],
                quote: "A paz não é ausência de violência. É saber quando ela é necessária. — Vittorio “Vitto” Moretti"
            },
            {
                name: "O Preço do Sonho",
                difficulty: 5,
                power: 5,
                description: [
                    "Luke envolve uma área de 8m em uma ilusão do “mundo perfeito”.",
                    "Todos dentro fazem VONTADE DT20.",
                    "Falha: sofrem <span class=\"hl-damage\">5d10 de dano de ocultismo</span> e ficam Mentalmente Instáveis.",
                    "Sucesso: metade do dano. Cooldown: 4 rodadas."
                ],
                quote: "Tudo tem um preço. Até a realidade. — Luke Goldengate"
            },
            {
                name: "Cortina de Ferro",
                difficulty: 5,
                power: 5,
                description: [
                    "Anatoly invoca uma linha de soldados paranormais que dispara contra todos os inimigos em uma área de 8m.",
                    "Causa <span class=\"hl-damage\">6d8 de dano de Perfuração</span> e impede os atingidos de se moverem até o próximo turno. Cooldown: 4 rodadas."
                ],
                quote: "Uma nação não recua. Uma nação avança. — Anatoly Markov"
            },
            {
                name: "Hyakki Yagyo — 百鬼夜行",
                difficulty: 5,
                power: 5,
                description: [
                    "Libera uma procissão de Yokais que atravessa uma área de 10m, atacando todos os inimigos. Causa <span class=\"hl-damage\">6d10 de dano Oculto</span>.",
                    "Ao final, cada alvo atingido sofre 1 efeito aleatório de Yokai: Medo, Lentidão, Cegueira ou Translocação. Cooldown: 4 rodadas."
                ],
                quote: "Vocês viveram acreditando que eram os donos deste mundo. Agora, caminhem ao lado dos monstros. — Yamiseth"
            },
            {
                name: "Papo de Malandro",
                difficulty: 2,
                power: 0,
                description: [
                    "Uma vez por cena, Gregory pode realizar um teste de PERSUASÃO com +2.",
                    "Se passar, pode convencer uma pessoa a reconsiderar uma decisão simples, fornecer uma informação ou conceder um pequeno favor.",
                    "Não funciona para obrigar alguém a fazer algo contra seus interesses ou mudar uma decisão importante. Cooldown: 1 cena"
                ],
                quote: "Calma, amigo. A gente pode resolver isso conversando. — Gregory Walton"
            },
            {
                name: "Execução Experimental",
                difficulty: 5,
                power: 5,
                description: [
                    "O Protótipo 0 escolhe um alvo adjacente e o agarra, utilizando o ambiente ou qualquer objeto próximo para executar uma sequência brutal e imprevisível.",
                    "Causa <span class=\"hl-damage\">6d10 de dano de Impacto/Corte</span> e o alvo fica Inconsciente se sobreviver com menos de 20% PV.",
                    "A execução pode mudar conforme o ambiente: parede, chão, veículo, arma improvisada etc. Cooldown: 3 rodadas"
                ],
                quote: "Ele não mata duas pessoas da mesma forma. — Registro da Goldengate"
            }
        ];

        // Converte Hex para RGBA para a luz ambiente transparente
        function hexToRgba(hex, alpha) {
            let c = hex.replace('#', '');
            if (c.length === 3) {
                c = c.split('').map(char => char + char).join('');
            }
            const num = parseInt(c, 16);
            const r = (num >> 16) & 255;
            const g = (num >> 8) & 255;
            const b = num & 255;
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        // Gera o marcador de 5 estrelas
        function renderStars(count) {
            let starsHTML = "";
            for (let i = 1; i <= 5; i++) {
                if (i <= count) {
                    starsHTML += `<span class="star-active">★</span>`;
                } else {
                    starsHTML += `<span class="star-inactive">☆</span>`;
                }
            }
            return starsHTML;
        }

        // Preenche o Select no carregamento da página
        function initGrimoire() {
            const selectEl = document.getElementById("skillSelect");
            selectEl.innerHTML = "";

            skillsData.forEach((skill, index) => {
                const option = document.createElement("option");
                option.value = index;
                option.textContent = skill.name;
                selectEl.appendChild(option);
            });

            updateSkill();
        }

        // Atualização dinâmica da interface ao selecionar uma habilidade
        function updateSkill() {
            const selectEl = document.getElementById("skillSelect");
            const index = selectEl.value;
            const skill = skillsData[index];
            const baseColor = difficultyColors[skill.difficulty];

            // 1. Título (Negrito + Caixa Alta + Cor da Dificuldade + Ajuste de brilho para tom 5)
            const titleEl = document.getElementById("skillTitle");
            titleEl.textContent = skill.name;
            titleEl.style.color = baseColor;
            
            if (skill.difficulty === 5) {
                // Brilho magenta/púrpura para sobressair a cor escura #210123
                titleEl.style.textShadow = `0 0 16px rgba(220, 100, 255, 0.75), 0 0 4px #e0a0ff, 0 2px 6px #000000`;
            } else {
                titleEl.style.textShadow = `0 0 20px ${hexToRgba(baseColor, 0.45)}`;
            }

            // 2. Descrição da habilidade em itens ordenados com destaque
            const descEl = document.getElementById("skillDescription");
            descEl.innerHTML = skill.description
                .map(item => `<div class="description-item">${item}</div>`)
                .join("");

            // 3. Frase / Citação do personagem
            const quoteContainer = document.getElementById("skillQuoteContainer");
            const quoteEl = document.getElementById("skillQuote");
            
            if (skill.quote && skill.quote.trim() !== "") {
                quoteEl.textContent = skill.quote.startsWith("“") || skill.quote.startsWith('"') ? skill.quote : `“${skill.quote}”`;
                quoteContainer.style.display = "block";
            } else {
                quoteContainer.style.display = "none";
            }

            // 4. Estrelas de Dificuldade e Poder
            document.getElementById("skillDifficulty").innerHTML = renderStars(skill.difficulty);
            document.getElementById("skillPower").innerHTML = renderStars(skill.power);

            // 5. Atualização da Luz Ambiente (Glow) no Fundo
            const ambientGlow = document.getElementById("ambientGlow");
            let glowRgbaCore, glowRgbaFade;

            if (skill.difficulty === 5) {
                // Aura magenta/violeta mística para dificuldade 5
                glowRgbaCore = "rgba(180, 20, 140, 0.35)";
                glowRgbaFade = "rgba(100, 10, 80, 0.1)";
            } else {
                glowRgbaCore = hexToRgba(baseColor, 0.28);
                glowRgbaFade = hexToRgba(baseColor, 0.08);
            }

            ambientGlow.style.background = `radial-gradient(
                ellipse 70% 60% at 50% 100%,
                ${glowRgbaCore} 0%,
                ${glowRgbaFade} 45%,
                rgba(18, 18, 20, 0) 80%
            )`;
        }

        window.onload = initGrimoire;
    </script>
</body>
</html>
