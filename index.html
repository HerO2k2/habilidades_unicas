<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grimório de Habilidades RPG</title>
    
    <!-- Google Fonts: Cinzel para títulos épicos e Inter para leitura do sistema -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Inter:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        :root {
            --bg-color: #121214;
            --glow-color: rgba(201, 3, 26, 0.25);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: #f3f4f6;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            position: relative;
        }

        /* Efeito de iluminação suave em degradê radial transparente (Ambient Glow) */
        .ambient-glow {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 140vw;
            height: 85vh;
            background: radial-gradient(
                ellipse 70% 60% at 50% 100%,
                var(--glow-color) 0%,
                rgba(18, 18, 20, 0.4) 50%,
                rgba(18, 18, 20, 0) 100%
            );
            pointer-events: none;
            z-index: 0;
            transition: background 0.8s ease-in-out;
        }

        .container-content {
            position: relative;
            z-index: 10;
        }

        /* Select customizado com Glassmorphism */
        .custom-select-wrapper {
            position: relative;
            width: 100%;
            max-width: 520px;
        }

        select {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            background-color: rgba(22, 22, 26, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: all 0.3s ease;
        }

        select:focus, select:hover {
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 18px rgba(255, 255, 255, 0.12);
            outline: none;
        }

        select option {
            background-color: #18181c;
            color: #f3f4f6;
            padding: 12px;
        }

        /* Cartão principal da Habilidade */
        .skill-card {
            background: rgba(20, 20, 24, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            transition: transform 0.3s ease, border-color 0.5s ease;
        }

        /* Título da Habilidade em Caixa Alta e Negrito */
        .skill-title {
            font-family: 'Cinzel', serif;
            letter-spacing: 0.08em;
            transition: color 0.4s ease, text-shadow 0.4s ease;
        }

        /* Marcadores de Lista na Descrição */
        .description-item {
            position: relative;
            padding-left: 1.5rem;
        }

        .description-item::before {
            content: "•";
            position: absolute;
            left: 0.25rem;
            color: rgba(255, 255, 255, 0.4);
            font-size: 1.2rem;
            line-height: 1;
        }

        /* Destaque de Dano / Ataque: LARANJA VIBRANTE (#ff9d00) */
        .dmg {
            color: #ff9d00;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(255, 157, 0, 0.35);
            padding: 0 2px;
        }

        /* Destaque de Vida / Sobrevivência / Recuperação PV: VERDE VIBRANTE (#2ed573) */
        .heal {
            color: #2ed573;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(46, 213, 115, 0.35);
            padding: 0 2px;
        }

        /* Estilo para a Tarja Preta de Censura */
        .censored {
            background-color: #000000;
            color: #000000;
            padding: 1px 6px;
            border-radius: 2px;
            user-select: none;
            display: inline-block;
            line-height: 1.1;
            box-shadow: 0 0 4px rgba(0,0,0,0.8);
            font-weight: 700;
        }

        .censored::selection {
            background-color: #000000;
            color: #000000;
        }

        /* Estrelas Douradas */
        .star-active {
            color: #ffd700;
            text-shadow: 0 0 6px rgba(255, 215, 0, 0.4);
        }

        .star-inactive {
            color: #4b5563;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between min-h-screen p-4 md:p-8 select-none">

    <!-- Efeito de Iluminação Dinâmica no Fundo -->

            </div>

            </div>

            <!-- Frase / Citação do Personagem -->

                <p id="skillQuote" class="text-xs md:text-sm italic text-gray-400 tracking-wide">
                    <!-- Citação dinâmica -->
                </p>
            </div>

            <!-- Canto Inferior: Dificuldade (Esquerda) e Poder (Direita) -->

                <!-- Dificuldade (Canto esquerdo) -->

                    <span class="text-xs uppercase tracking-wider text-gray-400">Dificuldade:</span>
                    <span id="skillDifficulty" class="text-base tracking-widest font-mono"></span>
                </div>

                <!-- Poder (Canto direito) -->

                    <span class="text-xs uppercase tracking-wider text-gray-400">Poder:</span>

                </div>

            </div>

        </div>

    </div>

        // Utilitário para conversão Hex para RGBA
        function hexToRgba(hex, alpha) {
            let c = hex.replace('#', '');
            if (c.length === 3) {
                c = c.split('').map(char => char + char).join('');
            }
            const num = parseInt(c, 16);
            const r = (num >> 16) & 255;
            const g = (num >> 8) & 255;
            const b = num & 255;
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        // Renderizador das Estrelas
        function renderStars(count) {
            let starsHTML = "";
            for (let i = 1; i <= 5; i++) {
                if (i <= count) {
                    starsHTML += `<span class="star-active">★</span>`;
                } else {
                    starsHTML += `<span class="star-inactive">☆</span>`;
                }
            }
            return starsHTML;
        }

        // Popula a Caixa de Seleção
        function initGrimoire() {
            const selectEl = document.getElementById("skillSelect");
            selectEl.innerHTML = "";

            skillsData.forEach((skill, index) => {
                const option = document.createElement("option");
                option.value = index;
                option.textContent = skill.name;
                selectEl.appendChild(option);
            });

            updateSkill();
        }

        // Atualização Dinâmica da Interface da Habilidade Selecionada
        function updateSkill() {
            const selectEl = document.getElementById("skillSelect");
            const index = selectEl.value;
            const skill = skillsData[index];
            const baseColor = difficultyColors[skill.difficulty];

            // 1. Título (Negrito, Caixa Alta, Cor de acordo com a Dificuldade)
            const titleEl = document.getElementById("skillTitle");
            titleEl.textContent = skill.name;
            titleEl.style.color = baseColor;
            
            // Tratamento especial de brilho neon/ultravioleta para Dificuldade 5 (#210123)
            if (skill.difficulty === 5) {
                titleEl.style.textShadow = `0 0 14px rgba(180, 0, 255, 0.85), 0 0 28px rgba(140, 0, 200, 0.6), 0 2px 4px #000000`;
            } else {
                titleEl.style.textShadow = `0 0 20px ${hexToRgba(baseColor, 0.45)}`;
            }

            // 2. Descrição com Destaques (.dmg, .heal e .censored)
            const descEl = document.getElementById("skillDescription");
            descEl.innerHTML = skill.description
                .map(item => `<div class="description-item">${item}</div>`)
                .join("");

            // 3. Frase / Citação do Personagem (Cinza discreto)
            const quoteContainer = document.getElementById("skillQuoteContainer");
            const quoteEl = document.getElementById("skillQuote");
            
            if (skill.quote && skill.quote.trim() !== "") {
                quoteEl.innerHTML = skill.quote.startsWith("“") || skill.quote.startsWith('"') ? skill.quote : `“${skill.quote}”`;
                quoteContainer.style.display = "block";
            } else {
                quoteContainer.style.display = "none";
            }

            // 4. Estrelas de Dificuldade e Poder
            document.getElementById("skillDifficulty").innerHTML = renderStars(skill.difficulty);
            document.getElementById("skillPower").innerHTML = renderStars(skill.power);

            // 5. Atualização da Luz Ambiente Dinâmica no Fundo
            const ambientGlow = document.getElementById("ambientGlow");
            let glowRgbaCore, glowRgbaFade;

            if (skill.difficulty === 5) {
                // Glow roxo/ultravioleta místico para a cor escura #210123
                glowRgbaCore = "rgba(160, 20, 220, 0.35)";
                glowRgbaFade = "rgba(90, 10, 140, 0.1)";
            } else {
                glowRgbaCore = hexToRgba(baseColor, 0.28);
                glowRgbaFade = hexToRgba(baseColor, 0.08);
            }

            ambientGlow.style.background = `radial-gradient(
                ellipse 70% 60% at 50% 100%,
                ${glowRgbaCore} 0%,
                ${glowRgbaFade} 45%,
                rgba(18, 18, 20, 0) 80%
            )`;
        }

</body>
