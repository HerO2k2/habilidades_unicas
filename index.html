<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG - Grimório de Habilidades</title>
    <!-- Fontes do Google: Cinzel para títulos de RPG e Inter para leitura do corpo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Inter:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        :root {
            --bg-color: #121214;
            --glow-color: rgba(201, 3, 26, 0.25);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: #f3f4f6;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            position: relative;
        }

        /* Efeito de luz ambiente em degradê suave/transparente vindo da parte inferior */
        .ambient-glow {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 140vw;
            height: 85vh;
            background: radial-gradient(
                ellipse 70% 60% at 50% 100%,
                var(--glow-color) 0%,
                rgba(18, 18, 20, 0.4) 50%,
                rgba(18, 18, 20, 0) 100%
            );
            pointer-events: none;
            z-index: 0;
            transition: background 0.8s ease-in-out;
        }

        .container-content {
            position: relative;
            z-index: 10;
        }

        /* Estilização da caixa de seleção no meio superior */
        .custom-select-wrapper {
            position: relative;
            width: 100%;
            max-width: 480px;
        }

        select {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            background-color: rgba(22, 22, 26, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: all 0.3s ease;
        }

        select:focus, select:hover {
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
            outline: none;
        }

        select option {
            background-color: #18181c;
            color: #f3f4f6;
            padding: 12px;
        }

        /* Cartão de habilidade em Dark Glassmorphism */
        .skill-card {
            background: rgba(20, 20, 24, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
            transition: transform 0.3s ease, border-color 0.5s ease;
        }

        .skill-title {
            font-family: 'Cinzel', serif;
            letter-spacing: 0.08em;
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            transition: color 0.4s ease, text-shadow 0.4s ease;
        }

        /* Marcadores das regras/descrições */
        .description-item {
            position: relative;
            padding-left: 1.5rem;
        }

        .description-item::before {
            content: "•";
            position: absolute;
            left: 0.25rem;
            color: rgba(255, 255, 255, 0.35);
            font-size: 1.2rem;
            line-height: 1;
        }

        /* [REQUISITO DE DESTAQUE DE CORES] */
        /* Dano e variáveis de ataque -> Laranja Vibrante */
        .hl-damage {
            color: #ff9d00;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(255, 157, 0, 0.3);
            padding: 0 2px;
        }

        /* Vida, sobrevivência, escudo e cura -> Verde Vibrante */
        .hl-heal {
            color: #2ed573;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(46, 213, 115, 0.3);
            padding: 0 2px;
        }

        /* Estrelas ativas e inativas */
        .star-active {
            color: #ffd700;
            text-shadow: 0 0 6px rgba(255, 215, 0, 0.4);
        }

        .star-inactive {
            color: #4b5563;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between min-h-screen p-4 md:p-8 select-none">

    <!-- Luz ambiente suave e transparente no fundo -->
    <div id="ambientGlow" class="ambient-glow"></div>

    <div class="container-content w-full max-w-3xl flex flex-col items-center my-auto py-6">
        
        <!-- [Caixa de seleção no meio superior da tela] -->
        <div class="custom-select-wrapper mb-8 w-full">
            <label for="skillSelect" class="block text-center text-xs uppercase tracking-widest text-gray-400 mb-2 font-semibold">
                Selecione uma Habilidade
            </label>
            <div class="relative">
                <select id="skillSelect" onchange="updateSkill()" class="w-full text-center text-base md:text-lg font-medium py-3.5 px-6 rounded-xl cursor-pointer text-gray-100">
                    <!-- Opções inseridas dinamicamente via JS -->
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-400">
                    <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
                        <path d="M9.293 12.95l0.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/>
                    </svg>
                </div>
            </div>
        </div>

        <!-- [Cartão Principal da Habilidade] -->
        <div class="skill-card w-full rounded-2xl p-6 md:p-10 flex flex-col justify-between gap-6">
            
            <!-- [Nome da Habilidade selecionada, Negrito + Caixa Alta + Cor dinânica] -->
            <div class="text-center border-b border-white/10 pb-5">
                <h1 id="skillTitle" class="skill-title font-black text-2xl md:text-4xl uppercase tracking-wider">
                    <!-- Preenchido via JavaScript -->
                </h1>
            </div>

            <!-- [Descrição da habilidade + Dano/Atributos destacados] -->
            <div id="skillDescription" class="space-y-3 text-gray-300 text-sm md:text-base leading-relaxed my-2">
                <!-- Lista de descrições -->
            </div>

            <!-- [Frase relacionada à habilidade - Nome do personagem] -->
            <div id="skillQuoteContainer" class="border-t border-white/10 pt-4 text-center">
                <p id="skillQuote" class="text-xs md:text-sm italic text-gray-400 tracking-wide">
                    <!-- Frase do personagem -->
                </p>
            </div>

            <!-- [Dificuldade (Canto esquerdo) | Poder (Canto direito)] -->
            <div class="flex flex-col sm:flex-row justify-between items-center gap-4 border-t border-white/10 pt-5 text-sm font-semibold text-gray-300">
                
                <!-- Dificuldade (Canto esquerdo) -->
                <div class="flex items-center gap-2 bg-black/30 px-4 py-2 rounded-lg border border-white/5 w-full sm:w-auto justify-between sm:justify-start">
                    <span class="text-xs uppercase tracking-wider text-gray-400">Dificuldade:</span>
                    <span id="skillDifficulty" class="text-base tracking-widest font-mono"></span>
                </div>

                <!-- Poder (Canto inferior direito) -->
                <div class="flex items-center gap-2 bg-black/30 px-4 py-2 rounded-lg border border-white/5 w-full sm:w-auto justify-between sm:justify-start">
                    <span class="text-xs uppercase tracking-wider text-gray-400">Poder:</span>
                    <span id="skillPower" class="text-base tracking-widest font-mono"></span>
                </div>

            </div>

        </div>

    </div>

    <script>
        // Mapeamento de cores da Dificuldade (0 a 5 estrelas)
        const difficultyColors = {
            0: "#fef7d5", // 0 estrelas (☆☆☆☆☆)
            1: "#0ec0c1", // 1 estrela
            2: "#910142", // 2 estrelas
            3: "#6c043c", // 3 estrelas
            4: "#c9031a", // 4 estrelas
            5: "#210123"  // 5 estrelas
        };

        // Dados das Habilidades com destaques configurados
        const skillsData = [
            {
                name: "Impulso de Combate",
                difficulty: 4,
                power: 0,
                description: [
                    "quando for atacado de surpresa, reaja imediatamente com uma habilidade, cancelando o ataque adversário e fazendo o inimigo ser o último na iniciativa.",
                    "Trocar de armas e mirar, não são considerados ações.",
                    "Ganha mais uma ação de combate.",
                    "Permite utilizar um combo de habilidades ativas desde que sejam sinérgicas."
                ],
                quote: "Não fui o melhor. Só fui o que ficou vivo. - Raffa Borges Pinto"
            },
            {
                name: "Troca de instância",
                difficulty: 2,
                power: 0,
                description: [
                    "Pode inverter seus pontos de AGI por FOR em combate e reverter a escolha como uma ação livre."
                ],
                quote: "Vingarei quem foi importante pra mim antes de cumprir meu papel. - Doyle"
            },
            {
                name: "PuMP€d B¥ S1Lv3R_Sh4d0₩",
                difficulty: 3,
                power: 0,
                description: [
                    "Role 1d20 para revelar uma fraqueza de uma criatura, dificuldade variada. Em caso de falha pode tentar novamente em outro turno."
                ],
                quote: "Nada é invencível. Só está mal documentado. - Barry Hargrove"
            },
            {
                name: "Sobrevivente do Fogo",
                difficulty: 1,
                power: 0,
                description: [
                    "Ao sofrer dano em uma explosão de fogo fatal fora de combate, sobreviverá com <span class=\"hl-heal\">1d8 de vida</span>. Se o evento acontecer em combate, então sobreviverá com <span class=\"hl-heal\">1d4 de vida</span>."
                ],
                quote: "Já senti o inferno uma vez. Quando ele voltou, eu estava preparado. - Fred Bone"
            },
            {
                name: "Fogo Cruzado",
                difficulty: 4,
                power: 5,
                description: [
                    "Durante 3 turnos individuais, seus ataques causam <span class=\"hl-damage\">1d12 + Equipamento</span>.",
                    "Ao ser atingido por um ataque corpo a corpo, causa <span class=\"hl-damage\">2d8 de dano</span> e pode se translocar. Cooldown: 2 rodadas."
                ],
                quote: "Você teve sua chance - V"
            }
        ];

        // Converte Hex para RGBA para a luz ambiente transparente
        function hexToRgba(hex, alpha) {
            let c = hex.replace('#', '');
            if (c.length === 3) {
                c = c.split('').map(char => char + char).join('');
            }
            const num = parseInt(c, 16);
            const r = (num >> 16) & 255;
            const g = (num >> 8) & 255;
            const b = num & 255;
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        // Gera estrelas (★ preenchida / ☆ vazia)
        function renderStars(count) {
            let starsHTML = "";
            for (let i = 1; i <= 5; i++) {
                if (i <= count) {
                    starsHTML += `<span class="star-active">★</span>`;
                } else {
                    starsHTML += `<span class="star-inactive">☆</span>`;
                }
            }
            return starsHTML;
        }

        // Inicialização do Select
        function initGrimoire() {
            const selectEl = document.getElementById("skillSelect");
            selectEl.innerHTML = "";

            skillsData.forEach((skill, index) => {
                const option = document.createElement("option");
                option.value = index;
                option.textContent = skill.name;
                selectEl.appendChild(option);
            });

            updateSkill();
        }

        // Atualização dos componentes na mudança de habilidade
        function updateSkill() {
            const selectEl = document.getElementById("skillSelect");
            const index = selectEl.value;
            const skill = skillsData[index];
            const baseColor = difficultyColors[skill.difficulty];

            // 1. Título (Negrito, Caixa Alta, Cor da Dificuldade)
            const titleEl = document.getElementById("skillTitle");
            titleEl.textContent = skill.name;
            titleEl.style.color = baseColor;
            titleEl.style.textShadow = `0 0 20px ${hexToRgba(baseColor, 0.4)}`;

            // 2. Descrição da habilidade com marcadores e cores destacadas
            const descEl = document.getElementById("skillDescription");
            descEl.innerHTML = skill.description
                .map(item => `<div class="description-item">${item}</div>`)
                .join("");

            // 3. Frase do personagem em cinza discreto
            const quoteContainer = document.getElementById("skillQuoteContainer");
            const quoteEl = document.getElementById("skillQuote");
            
            if (skill.quote && skill.quote.trim() !== "") {
                quoteEl.textContent = `“${skill.quote}”`;
                quoteContainer.style.display = "block";
            } else {
                quoteContainer.style.display = "none";
            }

            // 4. Estrelas de Dificuldade e Poder
            document.getElementById("skillDifficulty").innerHTML = renderStars(skill.difficulty);
            document.getElementById("skillPower").innerHTML = renderStars(skill.power);

            // 5. Atualização da Luz Ambiente de Fundo (Transparente)
            const ambientGlow = document.getElementById("ambientGlow");
            const glowRgbaCore = hexToRgba(baseColor, 0.28);
            const glowRgbaFade = hexToRgba(baseColor, 0.08);

            ambientGlow.style.background = `radial-gradient(
                ellipse 70% 60% at 50% 100%,
                ${glowRgbaCore} 0%,
                ${glowRgbaFade} 45%,
                rgba(18, 18, 20, 0) 80%
            )`;
        }

        window.onload = initGrimoire;
    </script>
</body>
</html>
